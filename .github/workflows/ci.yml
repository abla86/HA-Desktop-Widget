name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Audit dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Cancel remaining CI jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint . --max-warnings=0

      - name: Lint stylesheets
        run: npm run lint:css

      - name: Check formatting
        run: npm run format:check

      - name: Check repository hygiene
        run: npm run repo:check

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Build panel preview
        run: npm run build:panel

      - name: Rebuild native dependencies for packaging
        run: npm run native:rebuild

      - name: Package Windows app
        run: npx electron-builder --dir --win --x64 --publish never

      - name: Smoke launch packaged Windows app
        shell: pwsh
        timeout-minutes: 2
        run: |
          $executable = (Resolve-Path 'dist/win-unpacked/HA Desktop Widget.exe').Path
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -PassThru -Wait `
            -RedirectStandardOutput smoke-stdout.log -RedirectStandardError smoke-stderr.log
          Get-Content smoke-stdout.log, smoke-stderr.log -ErrorAction SilentlyContinue
          Get-ChildItem -Path $env:TEMP -Directory -Filter 'ha-desktop-widget-smoke-*' -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Cancel remaining CI jobs
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  lint-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install native build dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxinerama-dev libxrandr-dev libxext-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libpng-dev xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint . --max-warnings=0

      - name: Lint stylesheets
        run: npm run lint:css

      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Build renderer
        run: npm run build:renderer

      - name: Rebuild native dependencies for packaging
        run: npm run native:rebuild

      - name: Package Linux app
        run: npx electron-builder --dir --linux --x64 --publish never

      - name: Smoke launch packaged Linux app
        timeout-minutes: 2
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          timeout --kill-after=5s 30s xvfb-run -a dbus-run-session -- \
            dist/linux-unpacked/home-assistant-widget --smoke-test

      - name: Cancel remaining CI jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  package-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Rebuild native dependencies for packaging
        run: npm run native:rebuild

      - name: Package universal macOS app
        run: npx electron-builder --dir --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke launch packaged macOS app
        shell: bash
        timeout-minutes: 2
        run: |
          "dist/mac-universal/HA Desktop Widget.app/Contents/MacOS/HA Desktop Widget" --smoke-test

      - name: Verify universal macOS app
        shell: bash
        run: |
          executable="dist/mac-universal/HA Desktop Widget.app/Contents/MacOS/HA Desktop Widget"
          architectures="$(lipo -archs "$executable")"
          if [[ " $architectures " != *" x86_64 "* || " $architectures " != *" arm64 "* ]]; then
            echo "Expected a universal macOS executable; found architectures: $architectures" >&2
            exit 1
          fi

      - name: Cancel remaining CI jobs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
